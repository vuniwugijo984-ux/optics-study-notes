<polygon points="479.80,255.00 473.41,257.85 473.41,252.15" fill="#205fb5"/>
<path d="M550.00,255.00L700.00,255.00" fill="none" stroke="#205fb5" stroke-width="2"/>
<polygon points="646.00,255.00 639.61,257.85 639.61,252.15" fill="#205fb5"/>
<text x="377.00" y="230.00" class="small">出面到L₁ 10 cm</text>
<text x="578.00" y="285.00" class="small">镜距5 cm</text>
<text x="35.00" y="390.00" class="small">展开距离：近端A → 第一透镜 = 6 + 6 + 10 = 22 cm。</text>
<text x="35.00" y="420.00" class="small">棱镜等效6 cm、n=1.5的平板，像移2 cm；故等效物距大小20、21 cm。</text>
<path d="M40.00,550.00L875.00,550.00" fill="none" stroke="#7b8799" stroke-width="2"/>
<path d="M100.00,510.00L100.00,590.00" fill="none" stroke="#23344a" stroke-width="2"/>
<text x="60.00" y="620.00" class="small">B 等效−21</text>
<path d="M132.00,510.00L132.00,590.00" fill="none" stroke="#23344a" stroke-width="2"/>
<text x="92.00" y="650.00" class="small">A 等效−20</text>
<path d="M620.00,510.00L620.00,590.00" fill="none" stroke="#23344a" stroke-width="2"/>
<text x="580.00" y="620.00" class="small">L₁ = 0</text>
<path d="M740.00,510.00L740.00,590.00" fill="none" stroke="#23344a" stroke-width="2"/>
<text x="700.00" y="620.00" class="small">L₂ = 5</text>
<path d="M100.00,550.00L132.00,550.00" fill="none" stroke="#b64048" stroke-width="5"/>
<text x="35.00" y="472.00" class="small">等效计算轴（cm）：物长沿轴，图上的A、B不是横向物高。</text>
<text x="35.00" y="676.00" class="small">最终虚像：从L₂量，A′ = −10；B′ = −830/81 cm；轴向像长20/81 cm。</text>
<text x="35.00" y="712.00" class="small">上图实线只示轴向转折次序；非轴光线逐端按正文两次成像计算，不能按图量距。</text>
