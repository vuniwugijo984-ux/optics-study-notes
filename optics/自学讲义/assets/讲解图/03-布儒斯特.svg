<svg xmlns="http://www.w3.org/2000/svg" width="640" height="875" viewBox="0 0 640 875" role="img"><title>布儒斯特角的单界面与双界面棱镜几何</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#697587"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457d6"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c44938"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker></defs><rect width="640" height="875" fill="#fbfcff"/><g font-family="Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="25" fill="#172033" text-anchor="start">① 单界面：iB + rB = 90°</text><rect x="25" y="260" width="590" height="190" fill="#eaf0ff"/><path d="M30,260 L610,260" fill="none" stroke="#697587" stroke-width="2"/><path d="M320,70 L320,430" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><text x="328" y="86" font-size="21" fill="#172033" text-anchor="start">法线</text><text x="35" y="110" font-size="22" fill="#172033" text-anchor="start">外界 n₀</text><text x="35" y="425" font-size="22" fill="#172033" text-anchor="start">介质 n</text><path d="M100,113 L320,260" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M320,260 L540,113" fill="none" stroke="#c44938" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#r)"/><path d="M320,260 L420,410" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M271.91582079180756,227.5668115986967 A58,58 0 0 1 320.0,202.0" fill="none" stroke="#087f5b" stroke-width="3"/><text x="278.7896327910582" y="193.77893053558046" font-size="23" fill="#087f5b" text-anchor="middle">iB</text><path d="M347.74222137239997,301.59770610652413 A50,50 0 0 1 320.0,310.0" fill="none" stroke="#087f5b" stroke-width="3"/><text x="344.421096078186" y="331.1234826496649" font-size="23" fill="#087f5b" text-anchor="middle">rB</text><text x="425" y="90" font-size="21" fill="#c44938" text-anchor="start">p 反射为零</text><text x="421" y="432" font-size="21" fill="#2457d6" text-anchor="start">折射</text><text x="48" y="198" font-size="21" fill="#2457d6" text-anchor="start">入射</text><text x="24" y="493" font-size="25" fill="#172033" text-anchor="start">② 对称棱镜：两内部角相加等于 A</text><polygon points="320,545 153.33,795 486.67,795" fill="#eaf0ff" stroke="#697587" stroke-width="2"/><path d="M72,606.4 L236.67,675" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M236.67,675 L403.33,675" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M403.33,675 L568,606.4" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M169.17,630 L304.17,720" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M335.83,720 L470.83,630" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M280.66999999999996,675.0 A44,44 0 0 1 273.28024171550055,699.4067654869018" fill="none" stroke="#087f5b" stroke-width="3"/><path d="M366.71975828449945,699.4067654869018 A44,44 0 0 1 359.33,675.0" fill="none" stroke="#087f5b" stroke-width="3"/><text x="272" y="743" font-size="23" fill="#087f5b" text-anchor="start">rB</text><text x="345" y="743" font-size="23" fill="#087f5b" text-anchor="start">rB</text><path d="M350.5084568586273,590.7628021443757 A55,55 0 0 1 289.4915431413727,590.7628021443757" fill="none" stroke="#087f5b" stroke-width="3"/><text x="320.0" y="617.0" font-size="23" fill="#087f5b" text-anchor="middle">A</text><text x="55" y="566" font-size="21" fill="#172033" text-anchor="start">入射角 iB</text><text x="445" y="566" font-size="21" fill="#172033" text-anchor="start">出射