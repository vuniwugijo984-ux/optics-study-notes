<svg xmlns="http://www.w3.org/2000/svg" width="640" height="615" viewBox="0 0 640 615" role="img"><title>球面折射的顶点球心入射点实际路长与代数坐标</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#697587"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457d6"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c44938"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker></defs><rect width="640" height="615" fill="#fbfcff"/><g font-family="Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="25" fill="#172033" text-anchor="start">球面折射：路长 l 与坐标 s 不同</text><path d="M30,300 L610,300" fill="none" stroke="#697587" stroke-width="2" marker-end="url(#a)"/><text x="597" y="333" font-size="23" fill="#172033" text-anchor="start">z</text><path d="M302.7,172.7 A180,180 0 0 0 302.7,427.3" fill="none" stroke="#697587" stroke-width="3"/><path d="M70,300 L274.115,210" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M274.115,210 L570,300" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M190,161.44 L485,331.75" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><text x="58" y="330" font-size="24" fill="#172033" text-anchor="start">P</text><text x="237" y="330" font-size="24" fill="#172033" text-anchor="start">O</text><text x="425" y="330" font-size="24" fill="#172033" text-anchor="start">C</text><text x="558" y="330" font-size="24" fill="#172033" text-anchor="start">P′</text><text x="262" y="185" font-size="24" fill="#172033" text-anchor="start">A</text><text x="130" y="230" font-size="23" fill="#2457d6" text-anchor="start">l = PA</text><text x="409" y="224" font-size="23" fill="#2457d6" text-anchor="start">l′ = AP′</text><text x="450" y="365" font-size="22" fill="#172033" text-anchor="start">法线 AC</text><path d="M375.0,300.0 A55,55 0 0 1 382.3686027918559,272.5" fill="none" stroke="#087f5b" stroke-width="3"/><text x="360.4533405071871" y="281.3650287526185" font-size="23" fill="#087f5b" text-anchor="middle">φ</text><path d="M235.68669395030736,226.9489024468004 A42,42 0 0 1 237.74193304105358,189.0" fill="none" stroke="#087f5b" stroke-width="3"/><text x="211.2013364507535" y="206.80935003389826" font-size="23" fill="#087f5b" text-anchor="middle">i</text><path d="M336.3078829637445,228.8956425838864 A65,65 0 0 1 330.40665124598854,242.5" fill="none" stroke="#087f5b" stroke-width="3"/><text x="352.34243134731406" y="257.63178776722407" font-size="23" fill="#087f5b" text-anchor="middle">i′</text><path d="M284,210 L284,300" fill="none" stroke="#087f5b" stroke-width="2" stroke-dasharray="7 6"/><text x="294" y="280" font-size="22" fill="#087f5b" text-anchor="start">h</text><path d="M70,385 L250,385" fill="none" stroke="#087f5b" stroke-width="2"/><text x="104" y="414" font-size="23" fill="#087f5b" text-anchor="start">s &lt; 0</text><path d="M250,445 L570,445" fill="none" stroke="#087f5b" stroke-width="2"/><text x="365" y="476" font-size="23" fill="#087f5b" text-anchor="start">s′ &gt; 0</text><text x="35" y="535" font-size="23" fill="#172033" text-anchor="start">从 O 量轴向坐标；从 A 量实际路长</text><text x="35" y="578" font-size="25" fill="#087f5b" text-anchor="start">近轴时：l ≈ −s，l′ ≈ s′</text></g></svg>