<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="43" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#22344b" text-anchor="start">一片焦距已知的透镜：题目怎样消去剩余自由度</text><rect x="30" y="100" width="255" height="175" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="46" y="131" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">只给焦距 F</text><text x="46" y="160" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">s、s′ 两未知</text><text x="46" y="189" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">一个成像关系</text><text x="46" y="218" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">→ 仍有一参数</text><rect x="325" y="100" width="255" height="175" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="341" y="131" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">再给倍率 β</text><text x="341" y="160" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">s′ = βs</text><text x="341" y="189" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">两独立关系</text><text x="341" y="218" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">→ 定物位与像位</text><rect x="620" y="100" width="255" height="175" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="636" y="131" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">再给物屏距 L</text><text x="636" y="160" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">s′ − s = L</text><text x="636" y="189" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">实像分支、判别式</text><text x="636" y="218" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">→ 零 / 一 / 两解</text><rect x="915" y="100" width="255" height="175" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="931" y="131" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">再给平行出射</text><text x="931" y="160" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">1/s′ = 0</text><text x="931" y="189" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">物点在前焦点</text><text x="931" y="218" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">→ 无限远是边界</text><rect x="45" y="355" width="520" height="150" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="61" y="386" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">寻找路径：给量 → 中间量 → 目标量</text><text x="61" y="415" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">倍率题：β → s → s′ → 实虚与像高</text><text x="61" y="444" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">物屏题：L → 判别式 → 两镜位 → 回代</text><rect x="635" y="355" width="520" height="150" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="651" y="386" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">控制：选一个可以调整的量</text><text x="651" y="415" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">固定镜片：移动物点改变成像</text><text x="651" y="444" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">固定物屏：移动镜片满足清晰条件</text><text x="45" y="575" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#bd4036" text-anchor="start">计数只是第一步：方程须独立，还要检查解是否存在、符号分支是否符合实物/屏。</text><text x="45" y="618" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#22344b" text-anchor="start">“正立”只给 β 的正号，通常不足以确定唯一物距。</text></svg>