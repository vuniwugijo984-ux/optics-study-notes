<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img"><title>水下点的斜视轴交深度及法线角度</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#697587"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457d6"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c44938"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker></defs><rect width="640" height="620" fill="#fbfcff"/><g font-family="Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="25" fill="#172033" text-anchor="start">平面折射：先画同一横距，再比正切</text><rect x="25" y="210" width="590" height="250" fill="#eaf0ff"/><path d="M30,210 L610,210" fill="none" stroke="#697587" stroke-width="2"/><path d="M230,65 L230,455" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M345.47005383792515,80 L345.47005383792515,370" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M230,410 L345.47005383792515,210" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M345.47005383792515,210 L461.74558866791415,80" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M345.47005383792515,210 L230,339.09944487358064" fill="none" stroke="#c44938" stroke-width="2" stroke-dasharray="7 6"/><text x="35" y="85" font-size="22" fill="#172033" text-anchor="start">出射介质 n′</text><text x="35" y="445" font-size="22" fill="#172033" text-anchor="start">物方介质 n</text><text x="202" y="435" font-size="24" fill="#172033" text-anchor="start">P</text><text x="200" y="344.09944487358064" font-size="24" fill="#c44938" text-anchor="start">Q</text><text x="353.47005383792515" y="232" font-size="24" fill="#172033" text-anchor="start">A</text><text x="206" y="198" font-size="24" fill="#172033" text-anchor="start">O</text><path d="M345.47005383792515,262.0 A52,52 0 0 1 319.47005383792515,255.03332099679082" fill="none" stroke="#087f5b" stroke-width="3"/><text x="327.61153972585123" y="276.6488820139457" font-size="23" fill="#087f5b" text-anchor="middle">i</text><path d="M345.47005383792515,160.0 A50,50 0 0 1 378.80318234811574,172.73201717662843" fill="none" stroke="#087f5b" stroke-width="3"/><text x="377.376961857551" y="145.41038625345936" font-size="23" fill="#087f5b" text-anchor="middle">r</text><text x="55" y="315" font-size="22" fill="#172033" text-anchor="start">OP = d</text><text x="35" y="355" font-size="21" fill="#c44938" text-anchor="start">OQ = dapp</text><text x="260" y="187" font-size="23" fill="#087f5b" text-anchor="start">OA</text><text x="36" y="505" font-size="25" fill="#087f5b" text-anchor="start">OA = d tan i = dapp tan r</text><text x="36" y="552" font-size="22" fill="#172033" text-anchor="start">Q 是这条折射线的反向延长轴交点</text><text x="36" y="590" font-size="22" fill="#172033" text-anchor="start">改变 i，一般会得到另一个 Q。</text></g></svg>