<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="43" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#22344b" text-anchor="start">题目读到“看起来更大”，先确认比较的是什么</text><rect x="30" y="100" width="350" height="180" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="46" y="131" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">横向倍率 β = y′/y</text><text x="46" y="160" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">比较一对物像的高度</text><text x="46" y="189" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">正负：正立 / 倒立</text><text x="46" y="218" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">有屏可接不等于倍率为正</text><rect x="425" y="100" width="350" height="180" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="441" y="131" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">角倍率 γ = u′/u</text><text x="441" y="160" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">同一轴上共轭束的倾角比</text><text x="441" y="189" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">γ = s/s′；βγ = n/n′</text><text x="441" y="218" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">不额外再乘一次 n/n′</text><rect x="820" y="100" width="350" height="180" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="836" y="131" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">助视放大本领 M</text><text x="836" y="160" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">有仪器 / 裸眼参考的视角比</text><text x="836" y="189" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">放大镜：D/F 或 1+D/F</text><text x="836" y="218" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">显微镜：β物 × M目</text><line x1="380" y1="195" x2="425" y2="195" stroke="#1d64ad" stroke-width="2" marker-end="url(#arr)"/><rect x="45" y="375" width="510" height="180" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="61" y="406" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">长度方向还要区分：</text><text x="61" y="435" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">横向小物：Δy′ = β Δy</text><text x="61" y="464" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">轴向短段：Δs′ ≈ α Δs</text><text x="61" y="493" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">α = (n′/n) β²；长段分端点</text><rect x="645" y="375" width="510" height="180" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="661" y="406" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">放大不等于分辨：</text><text x="661" y="435" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">NA ↑ → 可接角锥增大</text><text x="661" y="464" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">衍射尺度 ↓，可能分清更小细节</text><text x="661" y="493" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">只换大倍数目镜不能补回丢失细节</text><text x="45" y="640" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#22344b" text-anchor="start">例：空气正镜 s = −30 cm，F = 10 cm → s′ = 15 cm，β = −1/2，γ = −2。</text><text x="45" y="686" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#bd4036" text-anchor="start">同一个结果的不同描述；β、γ、M 不是可以混用的三个“放大倍数”。</text></svg>