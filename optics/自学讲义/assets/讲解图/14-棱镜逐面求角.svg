<style>text{font:24px 'Microsoft YaHei',sans-serif;fill:#172033}.small{font-size:22px}.ray{stroke:#2457d6;stroke-width:4;fill:none}.normal{stroke:#936236;stroke-width:2;stroke-dasharray:8 6}.angle{stroke:#b42318;stroke-width:2.5;fill:none}.aux{stroke:#627087;stroke-width:2;stroke-dasharray:7 5}.label{font-style:italic;font-size:28px}</style>
<rect width="850" height="740" fill="white"/>
