<path d="M235.00,105.00L235.00,130.00" fill="none" stroke="#b64048" stroke-width="4"/>
<text x="247.00" y="110.00" class="small">B（远）</text>
<text x="247.00" y="139.00" class="small">A（近）</text>
<path d="M235.00,130.00L235.00,190.00" fill="none" stroke="#205fb5" stroke-width="2"/>
