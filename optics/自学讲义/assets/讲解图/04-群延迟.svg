<svg xmlns="http://www.w3.org/2000/svg" width="640" height="835" viewBox="0 0 640 835" role="img"><title>群延迟差与啁啾脉冲放大的机制示意</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#697587"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457d6"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c44938"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker></defs><rect width="640" height="835" fill="#fbfcff"/><g font-family="Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="25" fill="#172033" text-anchor="start">① 补偿的是不同频率的相对延迟</text><text x="28" y="95" font-size="22" fill="#c44938" text-anchor="start">较低频率</text><path d="M190,120 L600,120" fill="none" stroke="#697587" stroke-width="2" marker-end="url(#a)"/><path d="M270,90 L270,130" fill="none" stroke="#c44938" stroke-width="4"/><text x="28" y="195" font-size="22" fill="#2457d6" text-anchor="start">较高频率</text><path d="M190,220 L600,220" fill="none" stroke="#697587" stroke-width="2" marker-end="url(#a)"/><path d="M410,190 L410,230" fill="none" stroke="#2457d6" stroke-width="4"/><text x="243" y="159" font-size="23" fill="#c44938" text-anchor="start">τ₀</text><text x="360" y="260" font-size="23" fill="#2457d6" text-anchor="start">τ₀ + 2 fs</text><text x="440" y="310" font-size="22" fill="#172033" text-anchor="start">时间 t →</text><text x="30" y="365" font-size="24" fill="#087f5b" text-anchor="start">补偿后：两频率的延迟差约为 0</text><text x="24" y="435" font-size="25" fill="#172033" text-anchor="start">② 啁啾脉冲放大（CPA）的顺序</text><rect x="145.0" y="475" width="350" height="45" rx="15" fill="#dce6ff" stroke="#2457d6"/><text x="320" y="558" font-size="22" fill="#172033" text-anchor="middle">先展宽：持续更久，峰值降低</text><path d="M320,565 L320,592" fill="none" stroke="#697587" stroke-width="2" marker-end="url(#a)"/><rect x="145.0" y="600" width="350" height="45" rx="15" fill="#dce6ff" stroke="#2457d6"/><text x="320" y="683" font-size="22" fill="#172033" text-anchor="middle">再放大：增加脉冲能量</text><path d="M320,690 L320,717" fill="none" stroke="#697587" stroke-width="2" marker-end="url(#a)"/><rect x="265.0" y="725" width="110" height="45" rx="15" fill="#dce6ff" stroke="#2457d6"/><text x="320" y="808" font-size="22" fill="#172033" text-anchor="middle">后压缩：补偿频率相位差</text></g></svg>