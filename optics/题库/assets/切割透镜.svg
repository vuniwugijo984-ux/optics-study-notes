<text x="325.00" y="263.00" class="small">P：s = −5</text>
<text x="32.00" y="165.00" class="small" style="fill:#205fb5">上片的像：y′ = +0.5 cm</text>
<text x="32.00" y="315.00" class="small" style="fill:#19805d">下片的像：y′ = −0.5 cm</text>
<text x="535.00" y="205.00" class="small">c下 = +0.5</text>
<text x="535.00" y="291.00" class="small">c上 = −0.5</text>
<text x="30.00" y="404.00" class="small">两个像都在镜前10 cm，间隔1 cm；各片f′ = 10 cm不变。</text>
<text x="30.00" y="435.00" class="small">粗蓝/绿线：上下两片实际孔径；灰点：各片原光心平移后的位置。</text>
<text x="30.00" y="466.00" class="small">虚线是出射光的反向延长，不是额外入射光路；横纵比例不同。</text>
