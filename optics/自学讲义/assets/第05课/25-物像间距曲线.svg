<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">薄正透镜成实像时物像间距随物距变化</title>
  <desc id="desc">横轴为 u/f'，纵轴为 L/f'。曲线在 u/f'=2 时取得最小值 L/f'=4。</desc>
  <rect width="720" height="400" fill="#fbfcff"/>
  <g stroke="#dce3ee" stroke-width="1">
    <path d="M70 90H550 M70 140H550 M70 190H550 M70 240H550 M70 290H550"/>
    <path d="M70 70V310 M150 70V310 M230 70V310 M310 70V310 M390 70V310 M470 70V310 M550 70V310"/>
  </g>
  <g stroke="#172033" stroke-width="2" fill="none">
    <path d="M70 55V310H575"/>
    <path d="M70 55l-6 12h12z" fill="#172033"/>
    <path d="M575 310l-12-6v12z" fill="#172033"/>
  </g>
  <polyline points="78,88 82,170 86,210 94,249 102,268 110,278 118,283 134,289 150,290 190,286 230,278 310,257 390,234 470,210 550,186" fill="none" stroke="#2457d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#087f5b" stroke-width="2" stroke-dasharray="7 6">
    <path d="M150 290V310"/>
    <path d="M70 290H150"/>
  </g>
  <circle cx="150" cy="290" r="6" fill="#087f5b"/>
  <g fill="#34425a" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16">
    <text x="55" y="315" text-anchor="end">4</text>
    <text x="55" y="245" text-anchor="end">6</text>
    <text x="55" y="195" text-anchor="end">8</text>
    <text x="55" y="145" text-anchor="end">10</text>
    <text x="55" y="95" text-anchor="end">12</text>
    <text x="70" y="335" text-anchor="middle">1</text>
    <text x="150" y="335" text-anchor="middle">2</text>
    <text x="230" y="335" text-anchor="middle">3</text>
    <text x="310" y="335" text-anchor="middle">4</text>
    <text x="390" y="335" text-anchor="middle">5</text>
    <text x="470" y="335" text-anchor="middle">6</text>
    <text x="550" y="335" text-anchor="middle">7</text>
    <text x="590" y="335">u/f′</text>
    <text x="30" y="48">L/f′</text>
    <text x="165" y="282" fill="#087f5b">最小值 (2, 4)</text>
    <text x="360" y="55" text-anchor="middle" font-size="19" font-weight="700">实物成实像：物像间距曲线</text>
  </g>
</svg>
