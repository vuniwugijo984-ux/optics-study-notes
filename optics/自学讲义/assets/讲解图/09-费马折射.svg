<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" role="img"><title>费马折射推导的固定端点与可变界面点</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#697587"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457d6"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c44938"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker></defs><rect width="640" height="750" fill="#fbfcff"/><g font-family="Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="25" fill="#172033" text-anchor="start">费马原理：端点固定，只移动界面点 P</text><rect x="25" y="265" width="590" height="310" fill="#eaf0ff"/><path d="M30,265 L615,265" fill="none" stroke="#697587" stroke-width="2" marker-end="url(#a)"/><path d="M75,565 L75,65" fill="none" stroke="#697587" stroke-width="2" marker-end="url(#a)"/><text x="600" y="296" font-size="23" fill="#172033" text-anchor="start">x</text><text x="49" y="80" font-size="23" fill="#172033" text-anchor="start">y</text><path d="M75,100 L460,485" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M75,100 L295,265" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M295,265 L460,485" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M295,165 L295,375" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M460,265 L460,485" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><text x="110" y="85" font-size="23" fill="#172033" text-anchor="start">A = (0, a)</text><text x="470" y="505" 