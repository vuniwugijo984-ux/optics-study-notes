<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="43" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#22344b" text-anchor="start">公式关系：先定模型，再换原点；不同写法不是多条独立约束</text><rect x="35" y="85" width="340" height="110" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="51" y="116" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">精确反射 / 斯涅耳折射</text><text x="51" y="145" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">局部法线、角度与传播方向</text><text x="51" y="174" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">大角度先查透射条件</text><rect x="430" y="85" width="340" height="110" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="446" y="116" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">近轴：线性化光线倾角</text><text x="446" y="145" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">不同入射高度对应共同像点</text><text x="446" y="174" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">n′/s′ − n/s = Φ</text><line x1="375" y1="140" x2="430" y2="140" stroke="#1d64ad" stroke-width="2" marker-end="url(#arr)"/><rect x="825" y="85" width="340" height="110" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="841" y="116" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">系统结构决定 Φ 与主面</text><text x="841" y="145" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">单球面 / 薄镜 / 厚镜 / 组合</text><text x="841" y="174" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">顶点距要换成主点距</text><line x1="825" y1="140" x2="770" y2="140" stroke="#1d64ad" stroke-width="2" marker-end="url(#arr)"/><rect x="70" y="285" width="310" height="110" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="86" y="316" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">高斯：从顶点或主点量</text><text x="86" y="345" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">f/s + f′/s′ = 1</text><text x="86" y="374" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">适合给物距、像距、焦距</text><rect x="445" y="285" width="310" height="110" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="461" y="316" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">牛顿：从焦点量</text><text x="461" y="345" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">x = s − f；x′ = s′ − f′</text><text x="461" y="374" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">xx′ = ff′</text><rect x="820" y="285" width="310" height="110" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="836" y="316" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">倍率：同一共轭的附加描述</text><text x="836" y="345" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">β = ns′/(n′s)；γ = s/s′</text><text x="836" y="374" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">βγ = n/n′</text><line x1="600" y1="195" x2="225" y2="280" stroke="#1d64ad" stroke-width="2" marker-end="url(#arr)"/><line x1="600" y1="195" x2="600" y2="280" stroke="#1d64ad" stroke-width="2" marker-end="url(#arr)"/><line x1="600" y1="195" x2="975" y2="280" stroke="#1d64ad" stroke-width="2" marker-end="url(#arr)"/><line x1="380" y1="340" x2="445" y2="340" stroke="#8390a0" stroke-width="2" marker-end="url(#arr)"/><line x1="755" y1="340" x2="820" y2="340" stroke="#8390a0" stroke-width="2" marker-end="url(#arr)"/><rect x="70" y="490" width="470" height="110" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="86" y="521" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">题目再给一条独立条件：</text><text x="86" y="550" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">倍率 / 固定物屏距 / 两次移动 / 准直</text><text x="86" y="579" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">才可能把一个自由参数定下来</text><rect x="660" y="490" width="470" height="110" rx="10" fill="#edf4fc" stroke="#c8d5e3"/><text x="676" y="521" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">作图就是给出射方向加约束：</text><text x="676" y="550" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">过焦点 / 平行轴 / 节点方向 / 主面等高</text><text x="676" y="579" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#22344b" text-anchor="start">两条独立光线求交，第三条检查</text><line x1="225" y1="395" x2="305" y2="485" stroke="#1d64ad" stroke-width="2" marker-end="url(#arr)"/><line x1="975" y1="395" x2="895" y2="485" stroke="#1d64ad" stroke-width="2" marker-end="url(#arr)"/><text x="60" y="670" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#bd4036" text-anchor="start">同一式的移项、取倒数、换原点，不能重复计算为新的已知条件。</text><text x="60" y="711" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#22344b" text-anchor="start">两侧空气透射：f = −f′；镜面折返：f = f′。先分场景，再化简。</text></svg>