<svg xmlns="http://www.w3.org/2000/svg" width="640" height="955" viewBox="0 0 640 955" role="img"><title>分层介质的角度定义及上下蜃景的真实光路与反向视线</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#697587"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457d6"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c44938"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker></defs><rect width="640" height="955" fill="#fbfcff"/><g font-family="Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="25" fill="#172033" text-anchor="start">① 薄层折射 → 连续弯曲</text><rect x="28" y="65" width="584" height="80" fill="#f4f7ff"/><text x="40" y="105" font-size="22" fill="#172033" text-anchor="start">n₃ 较小</text><rect x="28" y="145" width="584" height="80" fill="#e9efff"/><text x="40" y="185" font-size="22" fill="#172033" text-anchor="start">n₂</text><rect x="28" y="225" width="584" height="80" fill="#dce6ff"/><text x="40" y="265" font-size="22" fill="#172033" text-anchor="start">n₁ 较大</text><path d="M28,145 L610,145" fill="none" stroke="#697587" stroke-width="2"/><path d="M28,225 L610,225" fill="none" stroke="#697587" stroke-width="2"/><path d="M220,295 L260,225 L325,145 L470,80" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M260,280 L260,170" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M325,200 L325,90" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M260.0,191.0 A34,34 0 0 1 281.3968932956945,198.577037310463" fill="none" stroke="#087f5b" stroke-width="3"/><text x="277.02414982092233" y="169.9252839542989" font-size="23" fill="#087f5b" text-anchor="middle">θ₂</text><path d="M325.0,110.0 A35,35 0 0 1 356.97409101749105,130.764217492347" fill="none" stroke="#087f5b" stroke-width="3"/><text x="355.3212298207814" y="93.38913046683794" font-size="23" fill="#087f5b" text-anchor="middle">θ₃</text><text x="350" y="270" font-size="22" fill="#172033" text-anchor="start">n 减小 → θ 增大</text><text x="365" y="305" font-size="21" fill="#172033" text-anchor="start">θ 从竖直法线量</text><text x="24" y="365" font-size="25" fill="#172033" text-anchor="start">② 下蜃景：向较大的 n（上方）弯</text><rect x="28" y="390" width="584" height="230" fill="#fff5df"/><text x="43" y="422" font-size="21" fill="#172033" text-anchor="start">较凉，n 较大</text><text x="43" y="600" font-size="21" fill="#172033" text-anchor="start">热路面附近，n 较小</text><path d="M100,450 Q310,670 530,465" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M530,465 L390,596" fill="none" stroke="#c44938" stroke-width="2" stroke-dasharray="7 6"/><text x="78" y="448" font-size="21" fill="#172033" text-anchor="start">远景</text><text x="530" y="443" font-size="23" fill="#172033" text-anchor="start">眼</text><text x="398" y="605" font-size="21" fill="#c44938" text-anchor="start">视线向下回溯</text><text x="24" y="675" font-size="25" fill="#172033" text-anchor="start">③ 上蜃景：向较大的 n（下方）弯</text><rect x="28" y="700" width="584" height="230" fill="#eaf0ff"/><text x="43" y="733" font-size="21" fill="#172033" text-anchor="start">上方 n 较小</text><text x="43" y="912" font-size="21" fill="#172033" text-anchor="start">冷海面附近，n 较大</text><path d="M100,875 Q310,655 530,860" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M530,860 L390,730" fill="none" stroke="#c44938" stroke-width="2" stroke-dasharray="7 6"/><text x="78" y="877" font-size="21" fill="#172033" text-anchor="start">远景</text><text x="535" y="883" font-size="23" fill="#172033" text-anchor="start">眼</text><text x="395" y="723" font-size="21" fill="#c44938" text-anchor="start">视线向上回溯</text></g></svg>