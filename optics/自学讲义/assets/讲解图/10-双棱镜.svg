<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img"><title>菲涅耳双棱镜的虚光源与光束重叠示意</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#697587"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457d6"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c44938"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f5b"/></marker></defs><rect width="640" height="710" fill="#fbfcff"/><g font-family="Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="25" fill="#172033" text-anchor="start">双棱镜：同一光源形成两个虚光源</text><polygon points="310,100 310,300 340,300" fill="#eaf0ff" stroke="#697587" stroke-width="2"/><polygon points="310,300 340,300 310,500" fill="#eaf0ff" stroke="#697587" stroke-width="2"/><path d="M50,300 L610,300" fill="none" stroke="#697587" stroke-width="2" stroke-dasharray="7 6"/><path d="M100,300 L310,240" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M310,240 L580,330" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#b)"/><path d="M100,300 L310,360" fill="none" stroke="#087f5b" stroke-width="3" marker-end="url(#g)"/><path d="M310,360 L580,270" fill="none" stroke="#087f5b" stroke-width="3" marker-end="url(#g)"/><path d="M310,240 L100,170" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="7 6"/><path d="M310,360 L100,430" fill="none" stroke="#087f5b" stroke-width="2" stroke-dasharray="7 6"/><circle cx="100" cy="300" r="5" fill="#697587"/><text x="35" y="282" font-size="22" fill="#697587" text-anchor="start">S 同一源</text><circle cx="100" cy="170" r="5" fill="#2457d6"/><text x="35" y="152" font-size="22" fill="#2457d6" text-anchor="start">S₁ 虚源</text><circle cx="100" cy="430" r="5" fill="#087f5b"/><text x="35" y="412" font-size="22" fill="#087f5b" text-anchor="start">S₂ 虚源</text><text x="395" y="215" font-size="21" fill="#2457d6" text-anchor="start">上半部光向下偏</text><text x="395" y="409" font-size="21" fill="#087f5b" text-anchor="start">下半部光向上偏</text><text x="455" y="315" font-size="21" fill="#172033" text-anchor="start">重叠</text><path d="M100,540 L310,540" fill="none" stroke="#697587" stroke-width="2"/><text x="180" y="574" font-size="23" fill="#172033" text-anchor="start">距离 l</text><text x="35" y="630" font-size="23" fill="#172033" text-anchor="start">虚线为出射光的反向延长线。</text><text x="35" y="675" font-size="22" fill="#172033" text-anchor="start">偏折角与源间距为便于辨认而放大。</text></g></svg>