<text x="25.00" y="32.00" class="title">3.23 先沿传播方向展开，再分别追踪纵向物的两端</text>
<path d="M170 190 L300 320 L300 190 Z" stroke="#23344a" fill="#edf4fb" stroke-width="2"/>
