<text x="172.00" y="163.00" class="small">A到上面6 cm</text>
<text x="165.00" y="300.00" class="small">内部合计6 cm</text>
<path d="M550.00,195.00L550.00,315.00" fill="none" stroke="#23344a" stroke-width="2"/>
<text x="495.00" y="350.00" class="small">L₁：+20 cm</text>
<path d="M700.00,195.00L700.00,315.00" fill="none" stroke="#23344a" stroke-width="2"/>
